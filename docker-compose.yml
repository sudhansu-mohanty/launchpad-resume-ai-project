services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: launchpad-web
    environment:
      - NODE_ENV=development
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started
    volumes:
      - ./frontend:/app
      - /app/node_modules

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: launchpad-api
    environment:
      - DATABASE_URL=postgresql://launchpad:launchpad@postgres:5432/launchpad_db
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  postgres:
    image: postgres:16-alpine
    container_name: launchpad-postgres
    environment:
      - POSTGRES_USER=launchpad
      - POSTGRES_PASSWORD=launchpad
      - POSTGRES_DB=launchpad_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U launchpad -d launchpad_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: launchpad-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:

